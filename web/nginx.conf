# ภาพถนนของแผนที่ (OpenStreetMap) ผ่าน server ของเราเอง + เก็บ cache — เบราว์เซอร์ของผู้ใช้ไม่ได้ติดต่อ OSM โดยตรง
# จึงไม่ส่ง IP ของผู้ใช้ออกไป และไม่ยิง OSM ซ้ำทุกครั้งที่มีคนเปิดแผนที่ (นโยบายการใช้ tile ของ OSM)
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=512m inactive=30d use_temp_path=off;

server {
  listen 80;
  root /usr/share/nginx/html;

  # ซูม 10–14 เท่านั้น (D9: ระดับถนน ไม่ถึงระดับบ้าน) — ระดับอื่นตอบ 404 ไม่ไปถาม OSM
  location ~ "^/tiles/(1[0-4])/(\d{1,5})/(\d{1,5})\.png$" {
    resolver 127.0.0.11 8.8.8.8 valid=300s ipv6=off;   # resolve ตอนใช้งาน: ไม่มีเน็ตก็ยังเปิด nginx ได้
    resolver_timeout 3s;
    set $osm tile.openstreetmap.org;
    proxy_pass https://$osm/$1/$2/$3.png;
    proxy_ssl_server_name on;
    proxy_ssl_name tile.openstreetmap.org;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header User-Agent "PetFinder-class-project/0.1 (+https://github.com/buildsudtae/petFinder)";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_ignore_headers Set-Cookie Cache-Control Expires;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_cache tiles;
    proxy_cache_key $1/$2/$3;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1h;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
    expires 7d;
  }
  location /tiles/ {
    return 404;
  }

  # ไฟล์ build ที่ไม่มีจริง (hash เก่าหลัง redeploy) ต้องได้ 404 ไม่ใช่ index.html ที่ browser รันเป็น JS ไม่ได้
  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;       # SPA fallback
  }
}
