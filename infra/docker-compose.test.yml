name: pettech-test

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pettech_test
      POSTGRES_USER: pettech
      POSTGRES_PASSWORD: testpw
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pettech -d pettech_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [pettest]

  api-test:
    build:
      context: ..
      dockerfile: infra/Dockerfile.test
    environment:
      DATABASE_URL: postgresql+psycopg://pettech:testpw@db:5432/pettech_test
      JWT_SECRET: test-secret
      UPLOAD_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-v", "tests/unit", "tests/integration", "worker/tests"]
    networks: [pettest]

networks:
  pettest:
    name: pettest
